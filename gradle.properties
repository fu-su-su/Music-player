org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
# 构建要求 JDK 17。若系统默认 Java 版本不符，可取消下一行注释并改成你的 JDK 17 路径
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.x.x-hotspot
org.gradle.caching=true
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.daemon.idletimeout=10800000

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=34

kotlin.code.style=official
kotlin.build.report.enable=false
kotlin.build.report.output=file
kotlin.daemon.useFallbackStrategy=true
kotlin.incremental=true

ksp.incremental=true
